<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Grabber</title><style>body{font:16px system-ui;max-width:50rem;margin:3rem auto;padding:0 1rem}input,button{padding:.5rem}li{margin:.5rem 0}</style><h1>Book Grabber</h1><form id="search"><input aria-label="Search books" required><button>Search</button></form><p id="status"></p><ul id="results"></ul><script>const f=document.querySelector('form'),r=document.querySelector('#results'),s=document.querySelector('#status');f.onsubmit=async e=>{e.preventDefault();s.textContent='Searching…';r.innerHTML='';let d=await fetch('/api/search?q='+encodeURIComponent(f.elements[0].value)).then(x=>x.json());s.textContent=`${d.total||0} results`;for(let b of d.results||[]){let l=document.createElement('li');l.textContent=`${b.title} — ${b.author} (${b.format}) `;let x=document.createElement('button');x.textContent='Grab';x.onclick=async()=>{let q=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sourceId:b.sourceId,title:b.title,author:b.author})}).then(z=>z.json());s.textContent=q.accepted?'Accepted by qBittorrent':q.error?.message};l.append(x);r.append(l)}}</script></html>
