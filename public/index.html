<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Book Grabber</title>
  <style>
    :root{color-scheme:dark;--bg:#10130f;--panel:#191e18;--line:#30392d;--text:#f0f2e9;--muted:#aeb8a7;--accent:#b9d986;--danger:#f0a49a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#0e120d,#171b15);color:var(--text);font:15px/1.5 system-ui,sans-serif}main{width:min(980px,calc(100% - 2rem));margin:2.5rem auto}header{display:flex;align-items:end;justify-content:space-between;gap:1rem}h1{margin:0;font:700 clamp(2rem,7vw,4.2rem)/.95 Georgia,serif;letter-spacing:-.04em}header p{color:var(--muted);margin:.5rem 0 0}.health{color:var(--accent)}nav{display:flex;gap:.4rem;overflow:auto;margin:2rem 0 1rem;padding-bottom:.25rem}button,input{font:inherit}button{border:1px solid var(--line);border-radius:.55rem;background:#222920;color:var(--text);padding:.6rem .85rem;cursor:pointer}button:hover,button[aria-selected=true]{border-color:var(--accent);color:var(--accent)}form{display:flex;gap:.5rem;flex-wrap:wrap}input{min-width:12rem;flex:1;border:1px solid var(--line);border-radius:.55rem;background:#0f130f;color:var(--text);padding:.7rem}section{display:none;border:1px solid var(--line);border-radius:1rem;background:rgba(25,30,24,.92);padding:1.25rem;min-height:19rem}section.active{display:block}.notice{min-height:1.5rem;color:var(--muted)}ul{padding:0;list-style:none}.card{display:grid;grid-template-columns:1fr auto;gap:.4rem 1rem;padding:.85rem 0;border-bottom:1px solid var(--line)}.card small{color:var(--muted)}.empty{color:var(--muted);font-style:italic}.danger{color:var(--danger)}@media(max-width:550px){header{display:block}.card{grid-template-columns:1fr}.card button{justify-self:start}}
  </style>
</head>
<body><main>
  <header><div><h1>Book Grabber</h1><p>Search MAM, hand off to qBittorrent, remember the trail.</p></div><div class="health" id="health-status">Checking…</div></header>
  <nav aria-label="Book grabber sections">
    <button data-tab="search" aria-selected="true">Search</button><button data-tab="history">History</button><button data-tab="queue">Queue</button><button data-tab="not-found">Not found</button><button data-tab="failed">Failed</button>
  </nav>
  <p class="notice" id="notice" aria-live="polite"></p>
  <section id="search" class="active"><form id="search-form"><input id="search-query" aria-label="Search title or author" placeholder="Title or author" required><button>Search</button></form><ul id="search-results"></ul></section>
  <section id="history"><h2>Download history</h2><ul id="history-items"></ul></section>
  <section id="queue"><h2>Wanted books</h2><form id="queue-form"><input id="queue-title" placeholder="Book title" required><input id="queue-notes" placeholder="Notes (optional)"><button>Add</button></form><ul id="queue-items"></ul></section>
  <section id="not-found"><h2>Not found on MAM</h2><form id="not-found-form"><input id="not-found-title" placeholder="Book title" required><input id="not-found-author" placeholder="Author"><input id="not-found-link" placeholder="Reference link"><button>Add</button></form><ul id="not-found-items"></ul></section>
  <section id="failed"><h2>Failed downloads</h2><ul id="failed-items"></ul></section>
</main><script>
const noticeElement=document.querySelector('#notice');
function showNotice(message,isError=false){noticeElement.textContent=message;noticeElement.classList.toggle('danger',isError)}
async function requestJson(url,options){const response=await fetch(url,options);const payload=await response.json();if(!response.ok)throw new Error(payload.error?.message||`Request failed (${response.status})`);return payload}
function showEmpty(listElement,message){listElement.innerHTML='';const item=document.createElement('li');item.className='empty';item.textContent=message;listElement.append(item)}
function makeCard(primary,secondary,action){const item=document.createElement('li');item.className='card';const text=document.createElement('div');const title=document.createElement('strong');title.textContent=primary;const detail=document.createElement('small');detail.textContent=secondary;text.append(title,document.createElement('br'),detail);item.append(text);if(action)item.append(action);return item}
document.querySelectorAll('nav button').forEach((tabButton)=>tabButton.addEventListener('click',()=>{document.querySelectorAll('nav button').forEach((button)=>button.setAttribute('aria-selected',String(button===tabButton)));document.querySelectorAll('section').forEach((section)=>section.classList.toggle('active',section.id===tabButton.dataset.tab));loadTab(tabButton.dataset.tab)}));
async function loadTab(tabName){try{if(tabName==='history'){const payload=await requestJson('/api/downloads');renderHistory(payload.downloads)}if(tabName==='queue'){const payload=await requestJson('/api/queue');renderQueue(payload.items)}if(tabName==='not-found'){const payload=await requestJson('/api/not-found');renderNotFound(payload.items)}if(tabName==='failed'){const payload=await requestJson('/api/failed');renderFailed(payload.items)}}catch(error){showNotice(error.message,true)}}
function renderHistory(downloads){const listElement=document.querySelector('#history-items');if(!downloads.length)return showEmpty(listElement,'No downloads yet.');listElement.replaceChildren(...downloads.map((download)=>makeCard(download.title||`MAM #${download.sourceId||download.id}`,`${download.author||'Unknown author'} · ${download.status||''} · ${download.date||''}`)))}
function renderQueue(items){const listElement=document.querySelector('#queue-items');if(!items.length)return showEmpty(listElement,'The queue is empty.');listElement.replaceChildren(...items.map((item)=>makeCard(item.text,item.done?'Complete':'Waiting')))}
function removeButton(endpoint,selector,reloadTab){const button=document.createElement('button');button.textContent='Remove';button.addEventListener('click',async()=>{try{await requestJson(endpoint,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify(selector)});await loadTab(reloadTab)}catch(error){showNotice(error.message,true)}});return button}
function renderNotFound(items){const listElement=document.querySelector('#not-found-items');if(!items.length)return showEmpty(listElement,'Nothing recorded here.');listElement.replaceChildren(...items.map((item,index)=>makeCard(item.title,`${item.author||'Unknown author'} · ${item.link||'No link'} · ${item.date}`,removeButton('/api/not-found',{index},'not-found'))))}
function renderFailed(items){const listElement=document.querySelector('#failed-items');if(!items.length)return showEmpty(listElement,'No failed downloads.');listElement.replaceChildren(...items.map((item,index)=>makeCard(item.title,`${item.author||'Unknown author'} · MAM #${item.torrentId} · ${item.error} · ${item.date}`,removeButton('/api/failed',{index},'failed'))))}
document.querySelector('#search-form').addEventListener('submit',async(event)=>{event.preventDefault();const query=document.querySelector('#search-query').value;showNotice('Searching…');try{const payload=await requestJson(`/api/search?q=${encodeURIComponent(query)}`);const listElement=document.querySelector('#search-results');if(!payload.results.length)showEmpty(listElement,'No matches found.');else listElement.replaceChildren(...payload.results.map((book)=>{const grabButton=document.createElement('button');grabButton.textContent='Grab';grabButton.addEventListener('click',async()=>{grabButton.disabled=true;showNotice(`Sending ${book.title}…`);try{await requestJson('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sourceId:book.sourceId,title:book.title,author:book.author,format:book.format,size:book.size,seeders:book.seeders})});showNotice(`${book.title} was accepted by qBittorrent.`)}catch(error){showNotice(error.message,true)}finally{grabButton.disabled=false}});return makeCard(book.title,`${book.author||'Unknown author'} · ${book.format||'Unknown format'} · ${book.size} · ${book.seeders} seeders`,grabButton)}));showNotice(`${payload.total} result${payload.total===1?'':'s'}.`)}catch(error){showNotice(error.message,true)}});
document.querySelector('#queue-form').addEventListener('submit',async(event)=>{event.preventDefault();try{await requestJson('/api/queue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.querySelector('#queue-title').value,notes:document.querySelector('#queue-notes').value})});event.target.reset();await loadTab('queue')}catch(error){showNotice(error.message,true)}});
document.querySelector('#not-found-form').addEventListener('submit',async(event)=>{event.preventDefault();try{await requestJson('/api/not-found',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.querySelector('#not-found-title').value,author:document.querySelector('#not-found-author').value,link:document.querySelector('#not-found-link').value})});event.target.reset();await loadTab('not-found')}catch(error){showNotice(error.message,true)}});
requestJson('/api/health').then(()=>{document.querySelector('#health-status').textContent='Service live'}).catch(()=>{document.querySelector('#health-status').textContent='Service unavailable'});
</script></body></html>
